<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - SkillShare</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%236366f1'/><text x='50' y='68' font-size='45' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>S</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>

  <script src="../js/constants.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    buildLayout();

    const user = getMockUser();
    const teachTags = ['Web Development', 'Python', 'CSS Styling'].map((s,i) => `<span class="skill-tag teach" style="animation:popIn .4s ${.1+i*.08}s both">${s}</span>`).join('');
    const learnTags = ['Pasta Making', 'Watercolor Painting', 'Guitar', 'Japanese'].map((s,i) => `<span class="skill-tag learn" style="animation:popIn .4s ${.3+i*.08}s both">${s}</span>`).join('');

    document.getElementById('app-content').innerHTML = `
      <div class="profile-container">
        <div class="profile-card anim">
          <div class="profile-top">
            <div class="profile-avatar" style="animation:bounceIn .6s ease">${getInitials(user.display_name)}</div>
            <div>
              <div class="profile-name">${user.display_name}</div>
              <div class="profile-bio">Learning to build cool stuff!</div>
              <div class="profile-actions">
                <button class="btn btn-ghost btn-sm" onclick="showToast('Edit profile coming soon!','info')">Edit Profile</button>
              </div>
            </div>
          </div>
        </div>
        <div class="skills-box anim" style="animation-delay:.15s">
          <h3 class="teach">🎓 Skills I Teach</h3>
          <div class="skill-tags">${teachTags}</div>
        </div>
        <div class="skills-box anim" style="animation-delay:.25s">
          <h3 class="learn">📚 Skills I Want to Learn</h3>
          <div class="skill-tags">${learnTags}</div>
        </div>
        <h3 style="margin-bottom:16px" class="anim" style="animation-delay:.35s">Your Posts</h3>
        <div class="empty-state anim" style="animation-delay:.4s"><p>Posts will appear here once the database is connected</p></div>
      </div>`;
  </script>
</body>
</html>
