<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a12">
  <title>Messages — Skill Swap</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%235b7cf7'/><text x='50' y='68' font-size='45' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>S</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script src="../js/client-api.js"></script>
  <script src="../js/constants.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    var activeConv = null;
    var lastMsgId = 0;
    var pollTimer = null;

    initLayout().then(function() {
      renderMessages();
      loadConversations();
    });

    function isMobile() { return window.innerWidth <= 768; }

    function renderMessages() {
      document.getElementById('app-content').innerHTML =
        '<div class="messages-layout">' +
          '<div class="conv-list" id="conv-list">' +
            '<div class="conv-header">Messages<button class="btn btn-primary btn-sm" onclick="showNewChat()">+</button></div>' +
            '<div id="new-chat-search" style="display:none;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-subtle)">' +
              '<input class="input" id="user-search" placeholder="Search username..." oninput="searchUsers()" style="font-size:13px;padding:var(--sp-2) var(--sp-3)">' +
              '<div id="user-results"></div>' +
            '</div>' +
            '<div class="conv-items" id="conv-items"></div>' +
          '</div>' +
          '<div class="chat-panel" id="chat-panel">' +
            '<div class="empty-chat">' +
              '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="opacity:0.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
              '<p>Select a conversation or start a new one</p>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function showConvList() {
      document.getElementById('conv-list').classList.remove('conv-hidden');
      document.getElementById('chat-panel').classList.add('chat-hidden');
    }

    function showChatPanel() {
      document.getElementById('conv-list').classList.add('conv-hidden');
      document.getElementById('chat-panel').classList.remove('chat-hidden');
    }

    function showNewChat() {
      var el = document.getElementById('new-chat-search');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
      if (el.style.display === 'block') document.getElementById('user-search').focus();
    }

    function searchUsers() {
      var q = document.getElementById('user-search').value.trim();
      var resEl = document.getElementById('user-results');
      if (!q) { resEl.innerHTML = ''; return; }
      API.searchUsers(q, function(err, users) {
        if (!users.length) { resEl.innerHTML = '<p style="font-size:12px;color:var(--text-tertiary);padding:var(--sp-2)">No users found</p>'; return; }
        resEl.innerHTML = users.map(function(u) {
          return '<div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2);cursor:pointer;border-radius:var(--radius-sm);transition:background 0.15s" onmouseover="this.style.background=\'var(--bg-raised)\'" onmouseout="this.style.background=\'\'" onclick="openChat(' + u.id + ',\'' + escapeHtml(u.username) + '\')">' +
            '<div class="avatar" style="width:30px;height:30px;font-size:11px">' + getInitials(u.username) + '</div>' +
            '<span style="font-size:13px">' + escapeHtml(u.username) + '</span>' +
          '</div>';
        }).join('');
      });
    }

    function loadConversations() {
      API.getConversations(function(err, convs) {
        var el = document.getElementById('conv-items');
        if (!convs.length) { el.innerHTML = '<p style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:var(--sp-8)">No conversations yet</p>'; return; }
        el.innerHTML = convs.map(function(c) {
          return '<div class="conv-item ' + (activeConv === c.id ? 'active' : '') + '" onclick="openChat(' + c.other_id + ',\'' + escapeHtml(c.other_name) + '\',' + c.id + ')">' +
            '<div class="avatar">' + getInitials(c.other_name) + '</div>' +
            '<div style="flex:1;min-width:0">' +
              '<div style="display:flex;justify-content:space-between;align-items:center">' +
                '<span class="conv-name">' + escapeHtml(c.other_name) + '</span>' +
                '<span class="conv-time">' + (c.last_message_at ? timeAgo(c.last_message_at) : '') + '</span>' +
              '</div>' +
              '<span class="conv-last">' + (c.last_message ? escapeHtml(c.last_message) : 'Start chatting...') + '</span>' +
            '</div>' +
            (c.unread > 0 ? '<span class="conv-unread">' + c.unread + '</span>' : '') +
          '</div>';
        }).join('');
      });
    }

    function openChat(userId, username, convId) {
      if (!convId) {
        API.createConversation(userId, function(err, data) {
          convId = data.id;
          continueOpenChat(userId, username, convId);
        });
      } else {
        continueOpenChat(userId, username, convId);
      }
    }

    function continueOpenChat(userId, username, convId) {
      activeConv = convId;
      lastMsgId = 0;
      document.getElementById('new-chat-search').style.display = 'none';

      var backBtn = isMobile()
        ? '<button class="btn btn-ghost btn-sm" onclick="showConvList()" style="margin-right:var(--sp-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg></button>'
        : '';

      document.getElementById('chat-panel').innerHTML =
        '<div class="chat-header">' +
          backBtn +
          '<div class="avatar" style="width:34px;height:34px;font-size:12px">' + getInitials(username) + '</div>' +
          '<div class="chat-header-info"><div class="chat-header-name">' + escapeHtml(username) + '</div></div>' +
          '<div style="display:flex;gap:var(--sp-1)">' +
            '<button class="btn btn-ghost btn-sm" onclick="startVideoCall()" title="Video Call">&#128249;</button>' +
            '<button class="btn btn-ghost btn-sm" onclick="startPhoneCall()" title="Phone Call">&#128222;</button>' +
          '</div>' +
        '</div>' +
        '<div class="chat-messages" id="chat-messages"></div>' +
        '<div class="chat-input-area">' +
          '<textarea class="textarea" id="msg-input" placeholder="Type a message..." rows="1" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>' +
          '<button class="btn btn-primary btn-sm" onclick="sendMsg()">Send</button>' +
        '</div>';

      if (isMobile()) showChatPanel();

      loadMessages();
      loadConversations();
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(loadMessages, 2000);
    }

    function loadMessages() {
      if (!activeConv) return;
      API.getMessages(activeConv, lastMsgId, function(err, msgs) {
        if (!msgs.length) return;
        var container = document.getElementById('chat-messages');
        if (!container) return;
        var wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;
        msgs.forEach(function(m) {
          var isMine = m.sender_id === currentUser.id;
          var div = document.createElement('div');
          div.className = 'msg ' + (isMine ? 'sent' : 'received');
          div.innerHTML = '<div><div class="msg-bubble">' + formatMsgBody(m.body) + '</div><div class="msg-time">' + timeAgo(m.created_at) + '</div></div>';
          container.appendChild(div);
          if (m.id > lastMsgId) lastMsgId = m.id;
        });
        if (wasAtBottom) container.scrollTop = container.scrollHeight;
        document.querySelectorAll('.conv-item.active').forEach(function(el) { el.classList.remove('active'); });
        document.querySelectorAll('.conv-item').forEach(function(el) {
          if (el.onclick && el.onclick.toString().indexOf(activeConv) !== -1) el.classList.add('active');
        });
      });
    }

    function formatMsgBody(body) {
      if (body.indexOf('[VIDEO CALL]') === 0) {
        var link = body.replace('[VIDEO CALL] ', '');
        return '<div style="display:flex;align-items:center;gap:var(--sp-2)">&#128249; <a href="' + link + '" target="_blank" style="word-break:break-all">Join Video Call</a></div>';
      }
      if (body.indexOf('[PHONE CALL]') === 0) {
        var num = body.replace('[PHONE CALL] ', '');
        return '<div style="display:flex;align-items:center;gap:var(--sp-2)">&#128222; <a href="tel:' + num + '">Call ' + num + '</a></div>';
      }
      return escapeHtml(body);
    }

    function sendMsg() {
      var input = document.getElementById('msg-input');
      var body = input.value.trim();
      if (!body || !activeConv) return;
      input.value = '';
      API.sendMessage(activeConv, body, function(err) {
        if (err) { showToast('Error sending', 'error'); return; }
        loadMessages();
      });
    }

    function startVideoCall() {
      var room = 'skillswap-' + activeConv + '-' + Date.now();
      var link = 'https://meet.jit.si/' + room;
      shareCallLink('[VIDEO CALL] ' + link, link);
    }

    function startPhoneCall() {
      var num = prompt('Enter phone number:');
      if (!num) return;
      shareCallLink('[PHONE CALL] ' + num, null);
    }

    function shareCallLink(body, displayLink) {
      if (!activeConv) return;
      API.sendMessage(activeConv, body, function(err) {
        if (err) { showToast('Error', 'error'); return; }
        if (displayLink) window.open(displayLink, '_blank');
        loadMessages();
      });
    }
  </script>
</body>
</html>
