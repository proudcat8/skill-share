<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a12">
  <title>Video Call — Skill Swap</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%235b7cf7'/><text x='50' y='68' font-size='45' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>S</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    initLayout().then(function(user) {
      var params = new URLSearchParams(window.location.search);
      var room = params.get('room');
      if (room) {
        document.getElementById('app').innerHTML =
          '<div class="main-content">' +
            '<div class="topbar">' +
              '<button class="mobile-toggle" onclick="history.back()" style="display:flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
              '<div style="font-weight:600">Video Call</div>' +
            '</div>' +
            '<div class="page-content" style="padding:0;height:calc(100vh - 52px);padding-bottom:env(safe-area-inset-bottom)">' +
              '<iframe src="https://meet.jit.si/' + room + '" style="width:100%;height:100%;border:none" allow="camera;microphone;fullscreen;display-capture" allowfullscreen></iframe>' +
            '</div>' +
          '</div>';
      } else {
        document.getElementById('app').innerHTML =
          '<div class="main-content">' +
            '<div class="topbar">' +
              '<button class="mobile-toggle" onclick="history.back()" style="display:flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg></button>' +
              '<div style="font-weight:600">Start a Call</div>' +
            '</div>' +
            '<div class="page-content" style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 56px)">' +
              '<div class="call-lobby">' +
                '<div class="call-preview">' +
                  '<div class="call-placeholder">' +
                    '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>' +
                    '<p>Start a video call with anyone</p>' +
                  '</div>' +
                '</div>' +
                '<button class="btn btn-primary btn-lg" onclick="startCall()" style="width:100%">&#128249; Start Video Call</button>' +
                '<button class="btn btn-ghost" onclick="history.back()" style="width:100%;margin-top:var(--sp-2)">Back</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }
    });

    function startCall() {
      var room = 'skillswap-' + currentUser.id + '-' + Date.now();
      location.href = 'call.html?room=' + room;
    }
  </script>
</body>
</html>
